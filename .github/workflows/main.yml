# .github/workflows/convert-zms-and-commit.yml
name: Convert ZMS → WAV and Commit

on:
  push:
    paths:
      - 'zms/**.zms'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout ZMusic source
      run: |
        git clone https://github.com/coelckers/ZMusic.git ZMusic-src

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libglib2.0-dev \
          libasound2-dev

    - name: Build zmusic2 via CMake
      run: |
        mkdir -p ZMusic-src/build
        cd ZMusic-src/build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        cmake --build . --target zmusic2

    - name: Convert all ZMS to WAV
      run: |
        binary=$(find ZMusic-src/build -maxdepth 1 -type f -executable -name zmusic2)
        if [ -z "$binary" ]; then
          echo "Error: zmusic2 binary not found"
          exit 1
        fi
        echo "Using binary: $binary"

        mkdir -p wavs
        for f in zms/*.zms; do
          out="wavs/${f##*/%.zms}.wav"
          echo "Converting $f → $out"
          "$binary" "$f" "$out"
        done

    - name: Commit converted WAVs
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add wavs/*.wav
        git diff --cached --quiet || git commit -m "Automated: add converted WAV files"

    - name: Push changes
      run: |
        git push origin HEAD:${{ github.ref }}
