# .github/workflows/convert-zms-to-wav.yml
name: Convert ZMS → WAV

on:
  push:
    paths:
      - '**/*.zms'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-convert:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build MDPlayer solution
        run: dotnet build ./MDPlayer/MDPlayer.sln -c Release

      - name: Publish mdpc CLI
        run: dotnet publish MDPlayer/mdpc/mdpc.csproj -c Release -r win-x64 --self-contained=false -o mdpc-pub

      - name: Convert all .zms → .wav
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path . -Recurse -Filter '*.zms' | ForEach-Object {
            Write-Host "Converting $($_.FullName)"
            .\mdpc-pub\mdpc.exe -w $_.FullName
          }

      - name: Commit and push WAV files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add **/*.wav
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
          } else {
            git commit -m "chore: add generated .wav files"
            git push
          }
