# .github/workflows/convert-zms-and-commit.yml
name: Convert ZMS → WAV and Commit

on:
  push:
    paths:
      - 'zms/**.zms'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest

    steps:
    # 1) メインリポジトリをチェックアウト
    - name: Checkout main repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2) zmusic2 リポジトリをチェックアウト
    - name: Checkout zmusic2 source
      uses: actions/checkout@v4
      with:
        repository: kg68k/zmusic2
        path: zmusic2
        fetch-depth: 1

    # 3) iconv を使った u8tosj ラッパーを用意
    - name: Install iconv shim for u8tosj
      run: |
        sudo apt-get update
        # iconv は libc-bin に含まれていることが多いです
        sudo apt-get install -y libc-bin
        sudo tee /usr/local/bin/u8tosj > /dev/null << 'EOF'
        #!/bin/sh
        # stdin を UTF-8 → CP932 (Shift_JIS) に変換して stdout に出力
        iconv -f UTF-8 -t CP932
        EOF
        sudo chmod +x /usr/local/bin/u8tosj

    # 4) zmusic2 のビルド
    - name: Build zmusic2
      working-directory: zmusic2
      run: |
        make

    # 5) ZMS → WAV 変換
    - name: Convert all ZMS to WAV
      run: |
        mkdir -p wavs
        for f in zms/*.zms; do
          echo "Converting $f → wavs/${f##*/%.zms}.wav"
          zmusic2/build/zmusic2 "$f" "wavs/${f##*/%.zms}.wav"
        done

    # 6) 生成された WAV を Git に追加
    - name: Commit converted WAVs
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add wavs/*.wav
        git diff --cached --quiet || git commit -m "Automated: add converted WAV files"

    # 7) リモートにプッシュ
    - name: Push changes
      run: |
        git push origin HEAD:${{ github.ref }}
