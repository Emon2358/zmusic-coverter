# .github/workflows/zmusic2-build-and-convert.yml
name: Build ZMUSIC2 & Convert ZMS → WAV

on:
  push:
    paths:
      - '**/*.zms'
      - '.github/workflows/zmusic2-build-and-convert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
    # 1) リポジトリ全体をチェックアウト（.zms も、WAV もコミット可能）
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'
        persist-credentials: true

    # 2) ビルドに必要なツール群をインストール
    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y build-essential nasm ffmpeg pulseaudio nkf

    # 3) nkf で src/*.s を Shift_JIS に変換し build/ 以下へ配置
    - name: Convert assembly sources to Shift_JIS
      run: |
        mkdir -p build
        for f in src/*.s; do
          nkf -s "$f" > build/$(basename "$f")
        done
        cp Makefile build/

    # 4) zmusic2 を build/ でビルド（Shift_JIS 化済ソースを利用）
    - name: Build zmusic2
      run: |
        cd build
        make    # → build/ZMUSIC.X などが生成される

    # 5) build/ 以下にできたバイナリを確認
    - name: List built binaries
      run: ls -l build/

    # 6) PulseAudio null-sink＋loopback をセットアップ（再生キャプチャ用）
    - name: Setup PulseAudio loopback
      run: |
        pactl load-module module-null-sink sink_name=zsink
        pactl load-module module-loopback source=zsink.monitor

    # 7) リポジトリ内の .zms を再生キャプチャして WAV 化
    - name: Convert .zms to .wav
      run: |
        mkdir -p wav-out
        for f in $(find . -name '*.zms'); do
          base=$(basename "$f" .zms)
          echo "Processing $f → wav-out/${base}.wav"
          ./build/ZMUSIC.X -nogui -PL- "$f" --audio-out zsink &
          pid=$!
          sleep 1
          ffmpeg -y -f pulse -i zsink.monitor -t 30 wav-out/${base}.wav
          kill $pid || true
        done

    # 8) 生成された WAV をコミット＆プッシュ
    - name: Commit and push WAV
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add wav-out/*.wav
        if git diff --cached --quiet; then
          echo "No WAV changes to commit"
        else
          git commit -m "chore: add generated WAV from zmusic2"
          git push
        fi
