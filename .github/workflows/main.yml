# .github/workflows/convert-zms-and-commit.yml
name: Convert ZMS → WAV and Commit

on:
  push:
    paths:
      - 'zms/**.zms'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout zmusic2 source
      uses: actions/checkout@v4
      with:
        repository: kg68k/zmusic2
        path: zmusic2
        fetch-depth: 1

    - name: Install iconv shim for u8tosj
      run: |
        sudo apt-get update
        sudo apt-get install -y libc-bin
        sudo tee /usr/local/bin/u8tosj > /dev/null << 'EOF'
        #!/bin/sh
        iconv -f UTF-8 -t CP932
        EOF
        sudo chmod +x /usr/local/bin/u8tosj

    - name: Build zmusic2
      working-directory: zmusic2
      run: make

    - name: Convert all ZMS to WAV
      run: |
        # ビルドされた zmusic2 バイナリを検索
        binary=$(find zmusic2 -type f -executable -name zmusic2 | head -n1)
        if [ -z "$binary" ]; then
          echo "Error: zmusic2 binary not found"
          exit 1
        fi

        mkdir -p wavs
        for f in zms/*.zms; do
          out="wavs/${f##*/%.zms}.wav"
          echo "Converting $f → $out"
          "$binary" "$f" "$out"
        done

    - name: Commit converted WAVs
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add wavs/*.wav
        git diff --cached --quiet || git commit -m "Automated: add converted WAV files"

    - name: Push changes
      run: git push origin HEAD:${{ github.ref }}
