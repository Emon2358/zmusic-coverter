# .github/workflows/convert-zms-and-commit.yml
name: Convert ZMS → WAV and Commit

on:
  push:
    paths:
      - 'zms/**.zms'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest

    steps:
    # 1) ソースリポジトリをチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2) 事前ビルド済み zmusic2 をダウンロード＆展開
    - name: Download and extract zmusic2 binary
      run: |
        mkdir -p zmusic2-bin
        curl -L \
          https://gitlab.com/linuxbombay/zmusic/binaries/1.1.14.r7.gf6facda/-/raw/main/zmusic-linux-x64.tar.xz \
          -o zmusic2.tar.xz
        tar -xJf zmusic2.tar.xz -C zmusic2-bin
        echo "Extracted files:"
        find zmusic2-bin -type f -maxdepth 2 -print

    # 3) ZMS → WAV 変換
    - name: Convert all ZMS to WAV
      run: |
        # 展開された実行ファイルを自動検出
        binary=$(find zmusic2-bin -type f -perm /u=x | head -n1)
        if [ -z "$binary" ]; then
          echo "Error: zmusic2 binary not found"
          exit 1
        fi
        echo "Using binary: $binary"

        mkdir -p wavs
        for f in zms/*.zms; do
          out="wavs/${f##*/%.zms}.wav"
          echo "Converting $f → $out"
          "$binary" "$f" "$out"
        done

    # 4) 生成された WAV をコミット
    - name: Commit converted WAVs
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add wavs/*.wav
        git diff --cached --quiet || git commit -m "Automated: add converted WAV files"

    # 5) リモートにプッシュ
    - name: Push changes
      run: |
        git push origin HEAD:${{ github.ref }}
