# .github/workflows/convert-zms-and-commit.yml
name: Convert ZMS → WAV and Commit

on:
  push:
    paths:
      - 'zms/**.zms'
  workflow_dispatch:

permissions:
  contents: write    # リポジトリへのコミット／プッシュに必須

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest

    steps:
    # 1) ソースリポジトリをチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2) 事前ビルド済み zmusic2 をダウンロード
    - name: Download prebuilt zmusic2 binary
      run: |
        # zmusic2 の最新安定版バイナリ (x86_64) を GitLab から取得
        mkdir -p zmusic2-bin
        curl -L \
          https://gitlab.com/linuxbombay/zmusic/binaries/1.1.14.r7.gf6facda/-/raw/main/zmusic-linux-x64.tar.xz \
          -o zmusic2.tar.xz
        tar -xJf zmusic2.tar.xz -C zmusic2-bin
        chmod +x zmusic2-bin/zmusic2
        ls -l zmusic2-bin/zmusic2    # バイナリの存在確認  [oai_citation:0‡AUR](https://aur.archlinux.org/packages/zmusic-bin?utm_source=chatgpt.com)

    # 3) ZMS → WAV 変換
    - name: Convert all ZMS to WAV
      run: |
        binary=zmusic2-bin/zmusic2
        if [ ! -x "$binary" ]; then
          echo "Error: zmusic2 binary not found or not executable"
          exit 1
        fi

        mkdir -p wavs
        for f in zms/*.zms; do
          out="wavs/${f##*/%.zms}.wav"
          echo "Converting $f → $out"
          "$binary" "$f" "$out"
        done

    # 4) 生成された WAV を Git に追加＆コミット
    - name: Commit converted WAVs
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add wavs/*.wav
        git diff --cached --quiet || git commit -m "Automated: add converted WAV files"

    # 5) リモートにプッシュ
    - name: Push changes
      run: |
        git push origin HEAD:${{ github.ref }}
