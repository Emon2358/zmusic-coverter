name: ZMS to WAV Converter

on:
  push:
    paths:
      - '**.zms'
  workflow_dispatch:

jobs:
  convert:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download MDPlayer
        run: |
          Invoke-WebRequest -Uri "https://github.com/kuma4649/MDPlayer/releases/download/STBL492/MDPlayer-STBL492.exe" -OutFile "MDPlayer.exe"
          New-Item -ItemType Directory -Path MDPlayer | Out-Null
          Start-Process -Wait -FilePath .\MDPlayer.exe -ArgumentList "/DIR=MDPlayer", "/SILENT"

      - name: Convert ZMS to WAV
        shell: pwsh
        run: |
          $mdpc = Join-Path $PWD 'MDPlayer\mdpc.exe'
          if (-Not (Test-Path "wav-out")) {
            New-Item -ItemType Directory -Path "wav-out" | Out-Null
          }

          Get-ChildItem -Recurse -Filter *.zms | ForEach-Object {
            $in  = $_.FullName
            $out = Join-Path $PWD "wav-out\$($_.BaseName).wav"
            Write-Host "Converting $in → $out"
            & $mdpc -w $in -o $out
          }

      - name: Copy WAV files to root (optional)
        run: |
          Copy-Item -Path wav-out\* -Destination . -Force

      - name: Commit WAV files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add wav-out/*.wav
          git commit -m "Add converted WAV files" || echo "Nothing to commit"
          git push
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
