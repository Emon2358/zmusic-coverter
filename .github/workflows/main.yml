# .github/workflows/convert-zms-with-mdpc.yml
name: Convert ZMS → WAV with MDPC (STBL492)

on:
  push:
    paths:
      - '**/*.zms'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: windows-latest

    steps:
      # チェックアウト
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      # 最新 STBL492 の MDPlayer-STBL492.exe をダウンロード
      - name: Download MDPlayer STBL492
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/kuma4649/MDPlayer/releases/download/STBL492/MDPlayer-STBL492.exe `
            -OutFile MDPlayer-STBL492.exe
          # GitHub Actions の Windows ランナーには 7z がプリインストール済み :contentReference[oaicite:1]{index=1}
          7z x MDPlayer-STBL492.exe -oMDPlayer

      # mdpc.exe（MDPlayer CLI）で .zms → .wav
      - name: Convert .zms to .wav
        shell: pwsh
        run: |
          $mdpc = Join-Path $PWD 'MDPlayer\mdpc.exe'
          New-Item -ItemType Directory -Path wav-out | Out-Null
          Get-ChildItem -Recurse -Filter *.zms | ForEach-Object {
            $in  = $_.FullName
            $out = Join-Path $PWD "wav-out\$($_.BaseName).wav"
            Write-Host "Converting $in → $out"
            & $mdpc -w $in -o $out
          }

      # 生成された WAV をコミット＆プッシュ
      - name: Commit WAVs
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wav-out/*.wav
          if (!(git diff --cached --quiet)) {
            git commit -m "chore: add generated WAV files (STBL492)"
            git push
          } else {
            Write-Host "No changes to commit"
          }
