name: zms→wav

on:
  workflow_dispatch:

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1) Install dependencies: PulseAudio, ffmpeg, build tools
      - name: Install build & audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git cmake pkg-config \
            pulseaudio pulseaudio-utils \
            ffmpeg

      # 2) Start PulseAudio in daemon mode so pactl will connect
      - name: Launch PulseAudio
        run: |
          pulseaudio --start
          # verify it's running
          pactl info

      # 3) Build run68 (Human68k CUI emulator) so we can run ZMUSIC.X
      - name: Build run68 emulator
        run: |
          git clone https://github.com/rururutan/run68.git run68
          cd run68/src
          make
          sudo cp run68 /usr/local/bin/

      # 4) Build zmusic2 as before
      - name: Build zmusic2 (Shift-JIS conversion + assemble)
        run: |
          mkdir -p build
          # convert all .s source files to Shift-JIS and place in build/
          for f in src/*; do
            nkf -s "$f" > build/$(basename "$f")
          done
          cp Makefile build/
          cd build
          make

      # 5) Convert every .zms → .wav
      - name: Convert .zms to .wav via run68 → ZMUSIC.X → PulseAudio → ffmpeg
        run: |
          mkdir -p wav
          for z in *.zms; do
            base="${z%.zms}"
            # 5.a run ZMUSIC.X inside run68, direct its audio to our null-sink “zsink”
            pactl load-module module-null-sink sink_name=zsink
            run68 build/ZMUSIC.X -nogui -PL- "$z" & sleep 1
            # 5.b record everything coming into the “zsink.monitor” device for 5 sec
            ffmpeg -y -f pulse -i zsink.monitor -t 5 wav/"$base".wav
            pactl unload-module module-null-sink
          done

      - name: List generated WAVs
        run: ls -l wav
