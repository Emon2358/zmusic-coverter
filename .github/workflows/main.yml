# .github/workflows/zmusic2-build-and-convert.yml
name: Build ZMUSIC2 & Convert ZMS → WAV

on:
  push:
    paths:
      - '**/*.zms'
      - '.github/workflows/zmusic2-build-and-convert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
    # 1) 自リポジトリをチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    # 2) zmusic2 をクローン
    - name: Clone ZMUSIC2 source
      run: |
        git clone https://github.com/kg68k/zmusic2.git zmusic2

    # 3) ビルドに必要なツールをインストール
    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y build-essential nasm ffmpeg pulseaudio nkf

    # 4) zmusic2/src の .s/.mac を nkf で Shift_JIS に変換 → zmusic2/build へ
    - name: Convert assembly sources to Shift_JIS
      run: |
        cd zmusic2
        mkdir -p build
        # .s および .mac ファイルをすべて変換
        for f in src/*.{s,mac}; do
          [ -e "$f" ] || continue
          nkf -s "$f" > build/$(basename "$f")
        done
        # Makefile をコピー
        cp Makefile build/

    # 5) build 以下で make 実行 → ZMUSIC.X 等を生成
    - name: Build zmusic2
      run: |
        cd zmusic2/build
        make

    # 6) 確認
    - name: List built binaries
      run: ls -l zmusic2/build/

    # 7) PulseAudio loopback 準備
    - name: Setup PulseAudio loopback
      run: |
        pactl load-module module-null-sink sink_name=zsink
        pactl load-module module-loopback source=zsink.monitor

    # 8) .zms を再生キャプチャして WAV 化
    - name: Convert .zms to .wav
      run: |
        mkdir -p wav-out
        for f in $(find . -name '*.zms'); do
          base=$(basename "$f" .zms)
          echo "Processing $f → wav-out/${base}.wav"
          ./zmusic2/build/ZMUSIC.X -nogui -PL- "$f" --audio-out zsink &
          pid=$!
          sleep 1
          ffmpeg -y -f pulse -i zsink.monitor -t 30 wav-out/${base}.wav
          kill $pid || true
        done

    # 9) 生成 WAV をコミット＆プッシュ
    - name: Commit and push WAV
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add wav-out/*.wav
        if git diff --cached --quiet; then
          echo "No WAV changes to commit"
        else
          git commit -m "chore: add generated WAV from zmusic2"
          git push
        fi
