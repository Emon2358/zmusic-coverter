# .github/workflows/zmusic2-build-and-convert.yml
name: Build ZMUSIC2 & Convert ZMS → WAV

on:
  push:
    paths:
      - '**/*.zms'
      - '.github/workflows/zmusic2-build-and-convert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-convert:
    runs-on: ubuntu-latest

    steps:
    # 1) リポジトリ全体をチェックアウト（.zms も、WAV もコミット可能）
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'
        persist-credentials: true

    # 2) ビルドに必要なツール群をインストール
    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y build-essential nasm ffmpeg pulseaudio

    # 3) u8tosj のソース取得＆ビルド（Makefile のある src ディレクトリで make） 
    - name: Build u8tosj
      run: |
        git clone https://github.com/kg68k/u8tosj.git _u8tosj
        cd _u8tosj/src
        make
        sudo cp u8tosj.r /usr/local/bin/u8tosj
        sudo chmod +x /usr/local/bin/u8tosj

    # 4) zmusic2 のビルド（Makefile 内で u8tosj が自動的に使われる）
    - name: Build zmusic2
      run: |
        make

    # 5) build/ 以下にできたバイナリを確認
    - name: List built binaries
      run: ls -l build/

    # 6) PulseAudio null-sink 準備（再生音声キャプチャ用ループバック）
    - name: Setup PulseAudio loopback
      run: |
        pactl load-module module-null-sink sink_name=zsink
        pactl load-module module-loopback source=zsink.monitor

    # 7) .zms を見つけて WAV に変換（30 秒録音）
    - name: Convert .zms to .wav
      run: |
        mkdir -p wav-out
        for f in $(find . -name '*.zms'); do
          base=$(basename "$f" .zms)
          echo "Processing $f → wav-out/${base}.wav"
          ./build/ZMUSIC.X -nogui -PL- "$f" --audio-out zsink &
          pid=$!
          sleep 1
          ffmpeg -y -f pulse -i zsink.monitor -t 30 wav-out/${base}.wav
          kill $pid || true
        done

    # 8) 生成された WAV をコミット＆プッシュ
    - name: Commit and push WAV
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add wav-out/*.wav
        if git diff --cached --quiet; then
          echo "No WAV changes to commit"
        else
          git commit -m "chore: add generated WAV from zmusic2"
          git push
        fi
