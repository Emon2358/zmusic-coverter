name: Debug Convert ZMusic → MP3

on:
  workflow_dispatch:

jobs:
  debug-convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Show $PATH & which commands
        run: |
          echo "PATH = $PATH"
          which zmusic || echo "zmusic not found"
          which ffmpeg || echo "ffmpeg not found"
          which lhasa  || echo "lhasa not found"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            libasound2-dev libsndfile1-dev \
            libglib2.0-dev ffmpeg lhasa

      - name: Build & install ZMusic
        run: |
          git clone https://github.com/coelckers/ZMusic.git
          mkdir ZMusic/build && cd ZMusic/build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo make install
          echo "zmusic version:"
          zmusic --version || echo "no version output"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: List candidate files
        run: |
          echo ">>> Looking for .zms/.zip/.lzh"
          find . -type f \( -iname "*.zms" -o -iname "*.zip" -o -iname "*.lzh" \)

      - name: Run conversion script
        run: |
          mkdir -p output_mp3
          python convert_zmusic.py --src-dir . --out-dir output_mp3 --bitrate 320k

      - name: List output_mp3
        run: |
          echo ">>> Contents of output_mp3:"
          ls -R output_mp3 || echo "(empty)"

      - name: Fail if no MP3
        run: |
          if [ -z "$(find output_mp3 -type f -name '*.mp3')" ]; then
            echo "::error::No MP3 files were generated!"
            exit 1
          fi

      - name: Show MP3 sizes
        run: |
          find output_mp3 -type f -name '*.mp3' -exec ls -lh {} \;

      - name: Commit & Push (debug)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output_mp3
          git commit -m "debug: converted MP3 ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          git push
